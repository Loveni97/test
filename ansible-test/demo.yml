---
- name: demo
  hosts: centos8
  vars:
    custom_pkg: this is vars
  tasks:
    - name: register
      shell: free -h
      register: result 
    - name: register
      debug:
        var: result  
    - name: gather
      package_facts:
        manager: auto
    - name: list
      debug:
        var: ansible_facts['packages']
    - name: Display NetworkManager version
      ansible.builtin.debug:
        msg: "Version {{ ansible_facts['packages']['NetworkManager'][0]['version'] }}"
      when: "'NetworkManager' in ansible_facts['packages']"
    - name: echo loop
      debug:
        msg: "{{ item }}"
      loop:
        - a
        - b

    - name: echo
      debug:
        msg: 
        >  
          "Free memory 
          for this system is {{ ansible_facts['memfree_mb'] }} {{ custom_pkg }}" 
    - name: Set authorized key
      ansible.posix.authorized_key:
        user: user2
        state: present
        key: "{{ lookup('ansible.builtin.file','files/user2/id_rsa.pub') }}"

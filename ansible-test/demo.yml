---
- name: demo
  hosts: centos
  tasks:
    - name: register
      shell: free -h
      register: result 
    - name: register
      debug:
        var: result['stdout_lines']  
    - name: gather package_facts
      package_facts:
        manager: auto
    # - name: list
    #   debug:
    #     var: ansible_facts['packages']
    - name: Display NetworkManager version
      ansible.builtin.debug:
        msg: "Version {{ ansible_facts['packages']['NetworkManager'][0]['version'] }}"
      when: "'NetworkManager' in ansible_facts['packages']"
    - name: echo loop
      debug:
        msg: "{{ item.username }}"
      loop:
        - username: name1
          passwd: 123
        - username: name2
          passwd: 321

    - name: echo
      debug:
        msg: 
        >  
          "Free memory 
          for this system is {{ ansible_facts['memfree_mb'] }} mb-----{{centos_host_var}}" 
---
- name: 创建 /etc/test.conf 并写入静态内容
  hosts: centos
  gather_facts: no
  tasks:
    - name: create file
      copy:
        content: |
          port=80
          host=0.0.0.0
          log_path=/var/log/test.log
        dest: /tmp/test.conf  # 远程节点文件路径（不存在则创建，存在则覆盖）
        mode: 0644
        owner: root
        group: root

    - name: touch directory
      file:
        path: /tmp/mydir1
        state: directory
        owner: devops

    - name: create soft link #目的链接不能存在
      file:
        src: /tmp/mydir1
        dest: /tmp/soft_link
        state: link

    - name: delete soft link #目的链接不能存在
      file:
        path: /tmp/soft_link
        state: absent

    - name: create hard link #文件夹不能创建硬链接
      file:
        src: /tmp/test.conf
        dest: /tmp/hard_link
        state: hard

    - name: modify file owner
      file:
        path: /tmp/test.conf  
        owner: devops
        group: devops

    - name: delete loop
      include_tasks: tasks/delete_file.yml #动态加载，才能取loop中值
      vars:
        file_path: "{{item}}"
      loop:
        - /tmp/mydir1
        - /tmp/hard_link
        - /tmp/test.conf
      register: delete_result
    
    - name: echo result
      debug:
        msg: "{{delete_result.msg}}---{{ centos_host_ip }}"

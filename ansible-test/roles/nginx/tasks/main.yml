- name: # 安装Nginx
  dnf:
    name: nginx
    state: present

# 任务2：复制Nginx配置模板到远程节点（替换原有配置）
- name: #复制Nginx配置模板
  template:  # template模块：复制模板文件并替换变量
    src: nginx.conf.j2  # 本地Role的templates/下的模板文件
    dest: /etc/nginx/nginx.conf  # 远程节点的Nginx配置路径
    mode: 0644
    owner: root
    group: root
  notify: restart_nginx  # 配置修改后，触发handlers中的restart_nginx触发器


# 任务3：启动Nginx并设置开机自启
- name: #启动Nginx并开机自启
  service:
    name: nginx
    state: started
    enabled: yes
